name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned deliberately. With `version: latest` a CLI release silently
          # broke CI on 2026-07-23: the local stack moved to publishable/secret
          # API keys, the legacy service_role JWT lost its privileges, and all
          # 46 integration tests failed with 42501 insufficient_privilege — with
          # no code change on our side. Bump this on purpose, not by surprise.
          version: 2.116.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:ci

      - name: Start local Supabase
        run: supabase start

      - name: Run integration tests
        run: |
          set -euo pipefail

          # The key names `supabase status -o env` exports have changed across
          # CLI releases, so resolve each value across the known variants
          # instead of trusting a single name. Previously an unresolved value
          # surfaced as dozens of opaque 42501 errors deep inside the test run;
          # now it fails here, naming what the CLI actually exported.
          eval "$(supabase status -o env)"

          url="${API_URL:-${SUPABASE_URL:-}}"
          anon="${ANON_KEY:-${SUPABASE_ANON_KEY:-${PUBLISHABLE_KEY:-}}}"
          service="${SERVICE_ROLE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-${SECRET_KEY:-}}}"

          for entry in "API URL:$url" "anon key:$anon" "service role key:$service"; do
            if [ -z "${entry#*:}" ]; then
              echo "::error::Could not resolve the ${entry%%:*} from 'supabase status -o env'."
              echo "Keys the CLI actually exported (values redacted):"
              supabase status -o env | sed 's/=.*/=<redacted>/'
              exit 1
            fi
          done

          SUPABASE_LOCAL_URL="$url" \
          SUPABASE_LOCAL_ANON_KEY="$anon" \
          SUPABASE_LOCAL_SERVICE_KEY="$service" \
            npm run test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Build
        run: npm run build
